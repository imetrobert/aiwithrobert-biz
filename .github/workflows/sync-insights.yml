name: Sync insights

# Bakes the latest issue of the blog (www.imetrobert.com/blog/feed.xml) into the "The Briefing" section, so the home page always
# names the newest issue without anyone editing it. Runs every morning (the blog publishes on the last day of the month) and on demand.

on:
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Read the blog feed and update the page
        run: python3 scripts/sync_insights.py

      - name: Rebuild French page, versions and checks
        run: |
          python3 scripts/check_content_sync.py
          python3 scripts/stamp_assets.py
          python3 scripts/build_fr_page.py
          python3 scripts/check_site.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A index.html fr
          git diff --staged --quiet || git commit -m "chore: sync latest blog issue [skip ci]"
          git push
